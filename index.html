<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart</title>
    <!-- Bootstrap RTL CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <!-- SweetAlert2 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <!-- Google Font (Cairo) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Cart.css" />
  </head>
  <body>
    <div id="cart" class="page">
      <div class="container py-5" style="max-width: 800px">
        <h3 class="section-title mb-4">سلة المشتريات</h3>
        <div id="cart-items" class="bg-white p-3 rounded-4 shadow-sm"></div>
        <div class="bg-white p-4 rounded-4 shadow-sm mt-3">
          <div class="d-flex justify-content-between fs-5 fw-bold">
            <span>الإجمالي:</span>
            <span id="total-price" class="price">0 جنيه</span>
          </div>
          <hr />
          <h5 class="fw-bold">بيانات التوصيل</h5>
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <input
                id="c-name"
                class="form-control"
                placeholder="الاسم بالكامل"
              />
            </div>
            <div class="col-md-6">
              <input
                id="c-phone"
                class="form-control"
                placeholder="رقم الموبايل"
              />
            </div>
            <div class="col-12">
              <input
                id="c-address"
                class="form-control"
                placeholder="العنوان بالتفصيل"
              />
            </div>
            <div class="col-12">
              <button
                onclick="placeOrder()"
                class="btn btn-main w-100 py-3 fs-5 fw-bold"
              >
                تأكيد الطلب <i class="bi bi-bag-check"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="Cart.js"></script>
  </body>
</html>
